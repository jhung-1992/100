<script>
const DATA=[{"title": "陸軍作戰要綱", "short": "作戰要綱", "count": 45, "questions": [{"n": "1", "q": "現代戰場用兵，應置重點於何處？", "a": "戰場用兵，應置重點於打擊敵指管系統，破壞聯合作戰關鍵結構，摧毀敵作戰重心，繼以殲滅敵人有生力量。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第一章第101004條 P1-1-1"}, {"n": "2", "q": "戰爭型態發展為何？", "a": "戰爭已朝非接觸、非對稱、非線性型態發展，主要體現在「多領域作戰」、「混合式作戰」等多樣化戰爭型態模式。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第一章第101005條 P1-1-1"}, {"n": "3", "q": "聯合作戰之意義", "a": "統合運用兩個（含）以上不同軍種或不同領域之作戰單位，陸上、水面（下）、空中、電磁、網路、太空等在明確的指揮管制關係下，執行共同任務，為達成同一作戰目的，所遂行之作戰，不論其階層與指揮關係如何，均謂之聯合作戰。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第三章第103001條 P1-3-10"}, {"n": "4", "q": "兵種協同作戰成功基礎", "a": "統一指揮、充分協調與合作、即時有效指揮管制，為遂行協同作戰成功的基礎與必備條件。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第三章第103042條 P1-3-19"}, {"n": "5", "q": "勤務支援一般原則為何？", "a": "1、後勤為先。\n2、先期整備。\n3、運輸安全。\n4、決心須以勤務能力為基礎。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第四章第104004條 P1-4-20"}, {"n": "6", "q": "戰術性電子戰區分為何？", "a": "1、電子戰攻擊。\n2、電子戰防護。\n3、電子戰支援。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第五章第105018條 P1-5-39"}, {"n": "7", "q": "政治作戰特性為何？", "a": "1、以人為中心。\n2、以智慧取勝。\n3、無時空限制。\n4、重視戰場經營。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第六章第106002條 P1-6-44"}, {"n": "8", "q": "軍事動員區分為何？", "a": "1、軍隊動員。\n2、軍需工業動員。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第七章第107006條 P1-7-50"}, {"n": "9", "q": "計畫動員種類有哪些？", "a": "1、部隊動員。\n2、輔助軍事勤務人力動員。", "src": "陸軍作戰要綱(115年)(115年)，第一篇第七章第107007條 P1-7-50"}, {"n": "10", "q": "防衛編組意義為何？", "a": "旨在因應防衛作戰需要，分別賦予作戰任務及責任地區，以統合地區內各部隊戰力，達成作戰目的。", "src": "陸軍作戰要綱(115年)(115年)，第二篇第三章第203015\n條 P2-3-60"}, {"n": "11", "q": "指揮之意義為何？", "a": "依法授予某個人以掌握與運用軍隊之職責，該個人將其意志變成所屬部隊之行動。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204001條 P2-4-63"}, {"n": "12", "q": "指揮關係之區分？", "a": "1、建制。\n2、編配。\n3、配屬。\n4、作戰管制。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204003條 P2-4-63"}, {"n": "13", "q": "指揮所之區分為？", "a": "1、主指揮所。\n2、後方指揮所。\n3、機動指揮所。\n4、預備指揮所。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204006條 P2-4-64"}, {"n": "14", "q": "指揮所位置選定考量因素為何？", "a": "1、便於指揮掌握，並適應戰況之推移。\n2、與上下級及友軍連絡容易。\n3、進出、變換容易，且有足夠之疏散空間。\n4、有利於警戒、隱（掩）蔽、防空及化生放核防護措施。\n5、各種通信、資訊設施建立容易。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204007條 P2-4-64"}, {"n": "15", "q": "指揮掌握之必要手段？", "a": "1、命令。\n2、通報。\n3、報告。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204009條 P2-4-65"}, {"n": "16", "q": "何謂決心？", "a": "乃由指揮官與參謀依狀況判斷而產生之結論，須由指揮官親自為之，為發展作戰構想之基礎，各級幹部應以堅強之意志貫徹。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204020條 P2-4-67"}, {"n": "17", "q": "部隊掌握之基礎為何？", "a": "1、統一戰術思想。\n2、示以明確作戰構想。\n3、賦予明確任務與作戰企圖。\n4、周密靈活通資連絡。\n5、下級指揮官適切之獨斷專行。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204028條 P2-4-69"}, {"n": "18", "q": "影響戰局之手段為何？", "a": "1、適時將火力重點指向所望地區。\n2、適切使用預備隊。\n3、彈性調整部署。\n4、靈活轉移兵力，促進作戰進展。", "src": "陸軍作戰要綱(115年)，第二篇第四章第204036條 P2-4-70"}, {"n": "19", "q": "何謂交戰規則？", "a": "交戰規則係於承平、作戰期間之法律規範，用以提供各級指揮官管理軍事行動上之運用，並藉各式任務使全體軍官、士、兵理解交戰規則概念，在共通性理解基礎上，擬定作戰計畫，執行軍事行動，俾確立部隊使用武力之合法性與正當性。", "src": "陸軍作戰要綱（115年），第二篇第五章第205004條 P2-5-71"}, {"n": "20", "q": "聯合作戰管制之範圍為何？", "a": "1、戰術行動。\n2、火力運用。\n3、後勤支援。\n4、政治作戰。\n5、其他足以危害安全之非軍事行動。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205006條 P2-5-71"}, {"n": "21", "q": "聯合作戰管制方式為何？", "a": "1、計畫管制。\n2、臨機管制。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205008條 P2-5-72"}, {"n": "22", "q": "聯合作戰管制指導為何？", "a": "1、確保聯合作戰各部隊作戰計畫、戰術行動及火力運用等，在時空因素上能配合一致、不相抵觸。\n2、明確律定部隊行動時間管制表，並督導確實執行。\n3、訂定適切之辨別、辨識規定及相互間之通報管道。\n4、互派連絡官。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205009條 P2-5-72"}, {"n": "23", "q": "空地作戰管制一般原則為何？", "a": "1、區分主從、分層負責。\n2、周密協調、確實管制。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205015條 P2-5-73"}, {"n": "24", "q": "地面作戰管制方式為何？", "a": "1、計畫管制。\n2、臨機管制。\n3、協調後管制。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205031條 P2-5-78"}, {"n": "25", "q": "何謂計畫管制", "a": "依據作戰計畫中各階段行動，對所管制部隊兵力之運用、時間因素配合及所望戰果，實施嚴密管制。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205031條 P2-5-78"}, {"n": "26", "q": "何謂臨機管制？", "a": "對新發現徵候，足以影響戰局或危害部隊安全者，應即修（增）訂計畫，並實施必要管制。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205031條 P2-5-78"}, {"n": "27", "q": "地面火力管制安全措施？", "a": "禁射線、火力支援協調線、自由射擊區、限制射擊線、火力協調區、禁射區、協調射擊線。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205033條 P2-5-78"}, {"n": "28", "q": "空域管制安全措施為何？", "a": "1、限制射擊空域。\n2、限航區。\n3、空中安全走廊。", "src": "陸軍作戰要綱(115年)，第二篇第五章第205034條 P2-5-79"}, {"n": "29", "q": "掌握主動之具體作為為何？", "a": "1、迅確的情報。\n2、適切的判斷。\n3、優勢的作為。\n4、全程作戰構想之儘早確立及謀略。\n5、欺敵之配合。", "src": "陸軍作戰要綱(115年)，第三篇第四章第304004條 P3-4-104"}, {"n": "30", "q": "逐次抵抗意義與目的為何？", "a": "逐次抵抗係沿敵軍進攻路線，利用充分之縱深地區、地形，構成數帶陣地或據點，交互實施抵抗與轉進之作戰。其目的在延滯敵決戰，儘量保存戰力，以空間換取時間，消耗與遲滯敵軍，並藉連續不斷有限目標攻擊、伏擊與襲擊，予敵最大損害。", "src": "陸軍作戰要綱(115年)，第三篇第四章第304028條 P3-4-112"}, {"n": "31", "q": "逐次抵抗方式區分為何？", "a": "逐次抵抗方式區分數帶陣地逐次抵抗、大縱深多據點逐次抵抗等兩種。數帶陣地逐次抵抗又區分連續陣地、交替陣地逐次抵抗兩種。", "src": "陸軍作戰要綱(115年)，第三篇第四章第304028條 P3-4-112"}, {"n": "32", "q": "防衛作戰特性為何？", "a": "1、獨立性\n2、被動性\n3、總體性\n4、後發性\n5、遲滯性\n6、不對稱性", "src": "陸軍作戰要綱(115年)，第四篇第一章第401003條 P4-1-126"}, {"n": "33", "q": "地面防衛作戰成功條件為何？", "a": "1、周密整備。\n2、全民防衛。\n3、戰力防護。\n4、灘岸及要域火殲。\n5、連續作戰。", "src": "陸軍作戰要綱(115年)，第四篇第一章第401008條 P4-1-128"}, {"n": "34", "q": "聯合國土防衛作戰基本概念為何？", "a": "1、獨立守備。\n2、分區制弱。\n3、灘岸及要域火殲。\n4、縱深防衛。", "src": "陸軍作戰要綱(115年)，第四篇第六章第402002條 P4-2-130"}, {"n": "35", "q": "地面防衛作戰核心概念為何？", "a": "持久作戰。", "src": "陸軍作戰要綱(115年)，第四篇第六章第402002條 P4-2-130"}, {"n": "36", "q": "戰備整備之目的？", "a": "目的在堅實戰備，奠定防衛作戰成功之基礎，並能肆應不預期之狀況。", "src": "陸軍作戰要綱(115年)，第四篇第三章第403001條 P4-3-138"}, {"n": "37", "q": "防衛作戰計畫區分為何？", "a": "戰備整備計畫、應變制變計畫、動員計畫、應急（聯合）作戰計畫及全面（聯合）作戰計畫。", "src": "陸軍作戰要綱(115年)，第四篇第三章第403004條 P4-3-139"}, {"n": "38", "q": "作戰計畫之策訂考慮因素為何？", "a": "作戰計畫之策定係依據上一級任務及構想（指導）所策定，應考慮任務、敵情、地形與天氣、我軍狀況及民情等因素。", "src": "陸軍作戰要綱(115年)，第四篇第三章第403006條 P4-3-140"}, {"n": "39", "q": "作戰計畫修訂時機為何？", "a": "1、依既定期程修訂。\n2、作戰型態、戰術、戰法改變時。\n3、軍隊組織編裝調整或武器裝備更新時。\n4、敵情、地形、地物產生變化時。\n5、計畫經演練發現缺失時。", "src": "陸軍作戰要綱(115年)，第四篇第三章第403009條 P4-3-140"}, {"n": "40", "q": "動員編實一般指導為何？", "a": "1、擬訂動員計畫，增強整體與持續戰力。\n2、建立軍（民）專業技術人員名冊，因應未來作戰需求。\n3、力求動員地域與任務一致。\n4、主動聯繫、確實核對，落實「編、管、訓、用」合一。\n5、力求動員結合編制專長，以適材適用。", "src": "陸軍作戰要綱(115年)，第四篇第一章第403020條 P4-3-143"}, {"n": "41", "q": "留置作戰之目的為何？", "a": "其目的在牽制、分散與遲滯敵軍行動，癱瘓其指揮、交通與後勤體系，削弱士氣與作戰節奏，策應我主力逆襲與規復行動。", "src": "陸軍作戰要綱(115年)，第四篇第五章第405019條 P4-5-194"}, {"n": "42", "q": "阻絕系統區分為何？", "a": "1、阻絕區。\n2、阻絕帶。\n3、阻絕群。", "src": "陸軍作戰要綱（115年），第四篇第五章第405065條 P4-5-198"}, {"n": "43", "q": "縱深防禦之意義為何？", "a": "縱深防禦係指依地形條件與敵軍前進方向，於縱後2至4公里至淺山丘陵間廣域區域內，運用地形特性構築多道防禦陣地與預想殲敵區，並結合主戰、守備、後備等兵力，遂行分層阻敵、逐次打擊之作戰行動。", "src": "陸軍作戰要綱（115年），第四篇第五章第405082條 P4-5-201"}, {"n": "44", "q": "跨區增援作戰指揮與管制之原則為何？", "a": "1、任務統一、權責分明。\n2、通達暢通、資訊共享。\n3、行動一致、機動適時。\n4、戰場交接、責任明確。", "src": "陸軍作戰要綱（115年），第四篇第五章第405123條 P4-5-221"}, {"n": "45", "q": "戰力重整之程序為何？", "a": "1、人員整編。\n2、裝備補充。\n3、精神重建。\n4、整後再訓。\n5、接續部署。", "src": "陸軍作戰要綱（115年），第四篇第五章第405130條 P4-5-224"}]}, {"title": "陸軍指揮參謀組織與作業教範", "short": "指揮參謀", "count": 35, "questions": [{"n": "1", "q": "何謂指揮關係？", "a": "指揮官基於權責，對被指揮者所產生之責任關係，謂之指揮關係。", "src": "陸軍指揮參謀組織與作業教範、第一章第01015條、P1-6頁"}, {"n": "2", "q": "何謂支援關係？", "a": "支援關係明示支援與被支援部隊（單位）間之關係與責任。", "src": "陸軍指揮參謀組織與作業教範、第一章第01016條、P1-6頁"}, {"n": "3", "q": "簡報分類為何？", "a": "1、任務簡報（含反向簡報、確認簡報）。\n2、戰場簡報（演習簡報）。\n3、業務簡報（含資料簡報）。\n4、參謀簡報。", "src": "陸軍指揮參謀組織與作業教範、第四章第04016條、P4-77頁"}, {"n": "4", "q": "戰場簡報（演習簡報）內容為何？", "a": "1、單位、級職、姓名。\n2、方向、地形及位置介紹。\n3、本單位任務及作戰構想。\n4、敵、我軍作戰經過概要。\n5、當前狀況及決心、處置。\n6、建議事項。", "src": "陸軍指揮參謀組織與作業教範、第四章第04018條、P4-79頁"}, {"n": "5", "q": "持續判斷須包含事項為何？", "a": "1、事實。\n2、假定事項。\n3、我（友）軍狀況。\n4、敵軍活動與能力。\n5、民事考量事項。\n6、結論與建議。", "src": "陸軍指揮參謀組織與作業教範、第五章第05007條、P5-120頁"}, {"n": "6", "q": "敵可能行動列舉時應包括哪些？", "a": "1、何時（開始行動時間）。\n2、何地（採取行動之地區）。\n3、何事（作戰或戰鬥方式與重點指向）。\n4、如何（採取行動之兵力大小）。", "src": "陸軍指揮參謀組織與作業教範、第五章第05015條、P5-146頁"}, {"n": "7", "q": "指參作業程序之階段劃分？", "a": "區分為「計畫作為」、「準備」與「執行」等三個階段。", "src": "陸軍指揮參謀組織與作業教範、第六章第06003條、P6-249頁"}, {"n": "8", "q": "指揮程序之內容？", "a": "1、任務分析及初步作戰概念。\n2、參謀作業指導。\n3、狀況判斷。\n4、決心及作戰構想。\n5、計畫與命令。\n6、督導實施。", "src": "陸軍指揮參謀組織與作業教範、第六章第06009條、P6-255頁"}, {"n": "9", "q": "軍事決策程序之步驟為何？", "a": "1、受領任務。\n2、任務分析。\n3、研擬行動方案。\n4、分析行動方案。\n5、比較行動方案。\n6、核准行動方案。\n7、頒布計畫（命令）。", "src": "陸軍指揮參謀組織與作業教範、第六章第06023條、P6-265頁"}, {"n": "10", "q": "軍事決策程序之重要作為之機制？", "a": "1、召開作戰會議（簡報）。\n2、指揮官對參謀實施作業指導。\n3、下達預備命令。", "src": "陸軍指揮參謀組織與作業教範、第六章第06029條、P6-270頁"}, {"n": "11", "q": "預備命令（第一次）之內容應包括哪些事項？", "a": "1、當前狀況與任務。\n2、作戰方式及作戰地區範圍。\n3、初步時間管制。\n4、部隊先期運動及偵搜指導。\n5、重要作戰準備事項與要求標準。\n6、其他重要準備事項。", "src": "陸軍指揮參謀組織與作業教範、第六章第06031條、P6-271頁"}, {"n": "12", "q": "指揮官初步參謀作業指導之內容為何？", "a": "1、任務說明。\n2、初步指揮官作戰企圖與作戰概念宣達。\n3、上級指揮官企圖之特別指示。\n4、完成任務所應先期準備事項。\n5、各參狀況判斷指導（含戰場情報準備作業）。\n6、律定召開作戰會議之時間、地點。\n7、其他事項。", "src": "陸軍指揮參謀組織與作業教範、第六章第06032條、P6-272頁"}, {"n": "13", "q": "受領任務後之作業步驟？", "a": "1、將狀況與任務，通知各參謀與作業人員。\n2、參謀持續資料蒐整。\n3、參謀完成資訊更新。\n4、指揮官行初步參謀作業指導。\n5、研擬預備命令。", "src": "陸軍指揮參謀組織與作業教範、第六章第06034條、P6-274頁"}, {"n": "14", "q": "任務分析之意義為何？", "a": "「任務分析」乃指揮官藉參謀之協助，對上級賦予之任務，實施深入理解之過程。", "src": "陸軍指揮參謀組織與作業教範、第六章第06042條、P6-283頁"}, {"n": "15", "q": "任務分析後產生之作業成果主要包含哪些？", "a": "1、戰場情報準備作業成果。\n2、各部隊之作戰能力與限制因素。\n3、風險評估事項。\n4、核定本部任務。\n5、指揮官初步作戰企圖與參謀作業指導。\n6、預備命令。\n7、行動方案評估要項。", "src": "陸軍指揮參謀組織與作業教範、第六章第06043條、P6-283頁"}, {"n": "16", "q": "任務分析後之戰場情報準備作業成果為何？", "a": "1、修正後混合障礙透明圖（地形對敵我作戰行動影響分析表）。\n2、天候對敵我作戰行動影響分析表。\n3、敵可能行動圖解及戰術運用分析表。\n4、徵候圖解及徵候分析表。\n5、情報判斷結論部分。", "src": "陸軍指揮參謀組織與作業教範、第六章第06043條、P6-283頁"}, {"n": "17", "q": "何謂特定行動？", "a": "由上級賦予、指派交由本單位執行之任務者，皆為「特定行動」。", "src": "陸軍指揮參謀組織與作業教範、第六章第06048條、P6-288頁"}, {"n": "18", "q": "何謂關鍵行動？", "a": "綜合分析特定行動與推斷行動之必然性、重要性、時序性與限制因素等後，即可歸納得出攸關本次作戰成敗之「關鍵行動」。", "src": "陸軍指揮參謀組織與作業教範、第六章第06048條、P6-289頁"}, {"n": "19", "q": "風險種類區分？", "a": "1、戰術風險。\n2、意外風險。", "src": "陸軍指揮參謀組織與作業教範、第六章第06052條、P6-295頁"}, {"n": "20", "q": "實施任務分析簡報後指揮官需完成哪些事項，以利後續作業？", "a": "1、核准「本部任務」。\n2、宣示其初步「指揮官作戰企圖」與研擬行動方案評估要項之指導。\n3、宣達後續之「參謀作業指導」。", "src": "陸軍指揮參謀組織與作業教範、第六章第06057條、P6-301頁"}, {"n": "21", "q": "指揮官擬定作戰企圖內心思維為何？", "a": "1、上級指揮官作戰企圖。\n2、本部行動與全般作戰關係。\n3、為圓滿達成任務所應獲取之戰果。\n4、多重目標與多重任務之主從。\n5、為達成任務之必要手段。", "src": "陸軍指揮參謀組織與作業教範、第六章第06059條、P6-305頁"}, {"n": "22", "q": "行動方案應具備之特性為何？", "a": "1、一致性。\n2、可行性。\n3、可接受性。\n4、獨特性。\n5、完整性。", "src": "陸軍指揮參謀組織與作業教範、第六章第06065條、P6-318頁"}, {"n": "23", "q": "研擬行動方案之步驟為？", "a": "1、分析敵、我相對戰力。\n2、研擬各種行動方案選項。\n3、初步規劃各行動方案所需兵力及部署。\n4、研擬各行動方案作戰構想。\n5、律定各行動方案任務編組。\n6、完成各行動方案文字敘述及圖解。", "src": "陸軍指揮參謀組織與作業教範、第六章第06066條、P6-319頁"}, {"n": "24", "q": "分析行動方案之意義為何？", "a": "藉由「分析行動方案」可檢視出我軍至當行動與最佳兵力編組，方能以最低損耗，獲致最大戰果，達成任務，並對爾後戰局開創有利態勢。", "src": "陸軍指揮參謀組織與作業教範、第六章第06078條、P6-339頁"}, {"n": "25", "q": "決心點為何？", "a": "係指在作戰任務執行中，需要下達處置作為有關之「重大事件」與兵、火力調整或危機及契機其所在「地點」，亦係指揮官或參謀預期必須下達決心之時、空（時機）點。", "src": "陸軍指揮參謀組織與作業教範、第六章第06086條、P6-345頁"}, {"n": "26", "q": "分析行動方案推演中，參謀必須針對每項敵可能行動列舉何事項？", "a": "1、重大事件。\n2、決心點。", "src": "陸軍指揮參謀組織與作業教範、第六章第06086條、P6-346頁"}, {"n": "27", "q": "決心點可依據何預判？", "a": "可依據作戰「經驗」與「教程」先行預判，然後再於推演時驗證，以判定下達決心之時間與地點。", "src": "陸軍指揮參謀組織與作業教範、第六章第06086條、P6-346頁"}, {"n": "28", "q": "評估要項為何？", "a": "係指在推演過程中，用以衡量行動方案作戰效能之項目，而該等要項將可能影響敵、我雙方作戰成敗之關鍵。", "src": "陸軍指揮參謀組織與作業教範、第六章第06087條、P6-346頁"}, {"n": "29", "q": "分析行動方案推演模式為何？", "a": "1、帶狀法。\n2、區塊法。\n3、條狀法。", "src": "陸軍指揮參謀組織與作業教範、第六章第06088條、P6-347頁"}, {"n": "30", "q": "分析行動方案推演之過程運作為何？", "a": "乃遵循「行動」－「反應」－「反制」之循環而運作。", "src": "陸軍指揮參謀組織與作業教範、第六章第06091條、P6-356頁"}, {"n": "31", "q": "分析行動方案推演成果為何？", "a": "1、決心支援圖解。\n2、協同計畫管制表。\n3、決心支援表。", "src": "陸軍指揮參謀組織與作業教範、第六章第06092條、P6-361頁"}, {"n": "32", "q": "決心簡報時使用何向指揮官實施簡報？", "a": "1、決心支援圖解（含決心支援表）。\n2、協同計畫管制表。\n3、行動方案比較表。", "src": "陸軍指揮參謀組織與作業教範、第六章第06105條、P6-374頁"}, {"n": "33", "q": "預演的形式概分為何？", "a": "1、全裝預演。\n2、減裝預演。\n3、沙盤推演。\n4、圖上推演。\n5、無線電預演。\n6、電腦兵棋推演。", "src": "陸軍指揮參謀組織與作業教範、第六章第06137條、P6-397頁"}, {"n": "34", "q": "快速決策與同步程序（RDSP）作業步驟為何？", "a": "1、瞭解當前狀況與預期之差異。\n2、決定採取何種決心類型與行動。\n3、修訂行動方案。\n4、確認行動方案與下達作戰指導。\n5、頒布作戰命令。", "src": "陸軍指揮參謀組織與作業教範、第六章第06164條、P6-409頁"}, {"n": "35", "q": "時間受限下指參作業程序節省時間之具體作為？", "a": "1、以既有計畫為基礎。\n2、增加指揮官親自參與程度。\n3、指揮官下達更明確之參謀作業指導。\n4、指揮官限制行動方案數量與兵棋推演次數。\n5、強化同步計畫作為。\n6、善用參謀作業指導。", "src": "陸軍指揮參謀組織與作業教範、第六章第06176條、P6-421頁"}]}, {"title": "陸軍戰場情報準備作業教範", "short": "戰場情報", "count": 10, "questions": [{"n": "1", "q": "戰場情報準備作業程序為何？", "a": "1、界定戰場空間。\n2、分析作戰地區。\n3、評估敵軍威脅。\n4、研判敵可能行動。", "src": "陸軍戰場情報準備作業教範、01012條、P1-8頁"}, {"n": "2", "q": "何謂「作戰地區」？", "a": "作戰地區乃是使部隊在一個被指定範圍內，遂行上級所分配之作戰行動；作戰地區幅員大小，須在上級指定區域範圍內，部隊指揮官依據所賦予之權責，指揮所屬部隊（含配屬及作戰管制），統一運用整合戰力，對抗敵軍，爭取勝利，達成任務。", "src": "陸軍戰場情報準備作業教範、02009條、P2-36頁"}, {"n": "3", "q": "何謂「利害地區」？", "a": "利害地區乃基於敵情偵蒐與情報預警，其範圍包括作戰地區與其鄰接地區，並延伸至敵我兵（火）力可涵蓋之區域。", "src": "陸軍戰場情報準備作業教範、02011條、P2-40頁"}, {"n": "4", "q": "地形分析中，地形五大要素為何？", "a": "障礙、接近路線、觀測與射擊、隱蔽與掩蔽、地形要點。", "src": "陸軍戰場情報準備作業教範、03010條、P3-60頁"}, {"n": "5", "q": "何謂障礙？", "a": "障礙乃指地面任何天然或人為之地形、地物，足以妨礙觀測、射擊、部隊運動者均屬之。", "src": "陸軍戰場情報準備作業教範、03012條、P3-61頁"}, {"n": "6", "q": "何謂接近路線？", "a": "供某一適當大小與類型之部隊，以通達地形要點或目標之適切而便利的運動空間，稱為接近路線。", "src": "陸軍戰場情報準備作業教範、03014條、P3-66頁"}, {"n": "7", "q": "依何步驟分析接近路線？", "a": "1、組合各機動走廊為接近路線。\n2、標繪接近路線。\n3、評估接近路線。\n4、賦予各接近路線編號。", "src": "陸軍戰場情報準備作業教範、03014條、P3-66頁"}, {"n": "8", "q": "何謂地形要點？", "a": "地形要點即任一地點或地區，其攻占或固守，對敵我雙方任一方，具有顯著利益者。地形要點對於任務的完成具有決定性的影響則稱之為關鍵地形。", "src": "陸軍戰場情報準備作業教範、03021條、P3-72頁"}, {"n": "9", "q": "何謂高價值目標？", "a": "高價值目標係指敵軍指揮官為達成任務所需之主要作戰部隊（單位）。", "src": "陸軍戰場情報準備作業教範、04016條、P4-102頁"}, {"n": "10", "q": "何謂高效益目標？", "a": "係我軍達成任務，應摧毀之主要戰力，敵軍失去此一目標後，可有利我軍任務之達成。", "src": "陸軍戰場情報準備作業教範、04018條、P4-104頁"}]}, {"title": "聯合兵種營作戰教範", "short": "聯兵營", "count": 10, "questions": [{"n": "1", "q": "攻擊時重點指向為何", "a": "1、敵未預期之正面。\n2、便於我戰力發揮，而不利於敵戰力發揮之處。\n3、敵之側翼、配備間隙、部隊接合部。\n4、敵素質低劣部隊。", "src": "聯合兵種營作戰教範第三章第03015條 P3-226"}, {"n": "2", "q": "聯合兵種營攻擊正面為何", "a": "營之攻擊正面主依第一線展開之連級部隊數量、偵蒐距離及支援火力所涵蓋的範圍來決定，通常概約為2,000～6,000公尺。", "src": "聯合兵種營作戰教範第三章第03017條 P3-227"}, {"n": "3", "q": "攻擊中足以左右戰局之手段為何？", "a": "1、適時有效集中火力。\n2、即時投入預備隊。\n3、親臨第一線領導攻擊。", "src": "聯合兵種營作戰教範第三章第03030條 P3-237～238"}, {"n": "4", "q": "突穿攻擊區分那些階段？", "a": "1、造成突破口。\n2、擴大突破口。\n3、奪取最後目標。", "src": "聯合兵種營作戰教範第三章第03037條 P3-240"}, {"n": "5", "q": "包圍攻擊區分那些階段？", "a": "1、完成包圍。\n2、壓縮包圍圈。\n3、分割擊滅。", "src": "聯合兵種營作戰教範第三章第03042條 P3-244～245"}, {"n": "6", "q": "追擊階段區分為何？", "a": "1、戰場追擊。\n2、縱隊追擊。", "src": "聯合兵種營作戰教範第三章第03053條 P3-252"}, {"n": "7", "q": "防禦意義與目的為何？", "a": "防禦係藉兵、火力與地形等之利用，拒止、消耗及摧破敵之攻擊，確保防禦地區，爭取時間或待增援部隊到達，以利全般與爾後之作戰。", "src": "聯合兵種營作戰教範第三章第03079條 P3-272～273"}, {"n": "8", "q": "防禦一般要領為何？", "a": "1、善用地形。\n2、爭取主動。\n3、形成重點。\n4、縱深配置。\n5、火力殲敵。", "src": "聯合兵種營作戰教範第三章第03083條 P3-274～275"}, {"n": "9", "q": "陣地防禦意義與目的為何？", "a": "陣地防禦係以主力部署於主陣地帶，依火力及逆襲，殲滅敵於陣地前或陣地內，以確保防禦地區完整之防禦方式。", "src": "聯合兵種營作戰教範第三章第03110條 P3-298"}, {"n": "10", "q": "聯合兵種營防禦正面及縱深為何？", "a": "營防禦正面通常為2,000～4,000公尺，縱深為2,000～3,000公尺。", "src": "聯合兵種營作戰教範第三章第03116條 P3-303"}]}];
const home=document.getElementById('home'), subject=document.getElementById('subject'), review=document.getElementById('review'), menu=document.getElementById('menu'), list=document.getElementById('list'), reviewList=document.getElementById('reviewList'), search=document.getElementById('search'), rangeStart=document.getElementById('rangeStart'), rangeEnd=document.getElementById('rangeEnd');
let current=null;
const STAR_KEY='sgm4_review_stars_v1';
let starred=new Set(JSON.parse(localStorage.getItem(STAR_KEY)||'[]'));
const qkey=(si,n)=>`${si}:${n}`;
function saveStars(){localStorage.setItem(STAR_KEY,JSON.stringify([...starred]));}
function toggleStar(si,n){const k=qkey(si,n);starred.has(k)?starred.delete(k):starred.add(k);saveStars();if(subject.classList.contains('active'))render(getFilteredQuestions());if(review.classList.contains('active'))renderReview();}
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
DATA.forEach((s,i)=>{const b=document.createElement('button');b.className='subject-btn';b.innerHTML=`<span class="subject-name">${esc(s.title)}</span><span class="subject-count">${esc(s.count)}</span>`;b.onclick=()=>openSubject(i);menu.appendChild(b)});const reviewMenuBtn=document.createElement('button');reviewMenuBtn.className='subject-btn';reviewMenuBtn.type='button';reviewMenuBtn.innerHTML='<span class="subject-name">Review</span><span class="subject-count">★</span>';reviewMenuBtn.onclick=openReview;menu.appendChild(reviewMenuBtn);

const RANGE_KEY='sgm4_subject_ranges_v1';
function getSavedRanges(){try{return JSON.parse(localStorage.getItem(RANGE_KEY)||'{}')}catch(e){return {}}}
function saveCurrentRange(){if(!current)return;const si=DATA.indexOf(current),r=getSavedRanges();r[si]={start:rangeStart.value,end:rangeEnd.value};localStorage.setItem(RANGE_KEY,JSON.stringify(r));}
function setupRangeInputs(){const max=current.questions.length,si=DATA.indexOf(current),saved=getSavedRanges()[si]||{};rangeStart.min=1;rangeStart.max=max;rangeEnd.min=1;rangeEnd.max=max;rangeStart.value=Math.max(1,Math.min(max,Number(saved.start)||1));rangeEnd.value=Math.max(1,Math.min(max,Number(saved.end)||max));}
function getFilteredQuestions(){if(!current)return[];const max=current.questions.length;let a=Math.max(1,Math.min(max,Number(rangeStart.value)||1)),b=Math.max(1,Math.min(max,Number(rangeEnd.value)||max));if(a>b){[a,b]=[b,a]}const k=search.value.trim().toLowerCase();return current.questions.filter(q=>{const n=Number(q.n);const inRange=n>=a&&n<=b;const hit=!k||[q.n,q.q,q.a,q.src].join(' ').toLowerCase().includes(k);return inRange&&hit;});}
function openSubject(i){current=DATA[i];document.getElementById('subjectTitle').textContent=current.title;search.value='';setupRangeInputs();home.classList.remove('active');review.classList.remove('active');subject.classList.add('active');render(getFilteredQuestions());window.scrollTo({top:0,behavior:'instant'});history.replaceState(null,'','#s'+(i+1));}
function render(items){if(!items.length){list.innerHTML='<div class="empty">找不到符合的題目</div>';return}const si=DATA.indexOf(current);list.innerHTML=items.map(q=>{const active=starred.has(qkey(si,q.n));return `<article class="qcard subject-question-card collapsed-answer" tabindex="0" role="button" aria-expanded="false"><button class="star-btn ${active?'active':''}" type="button" data-si="${si}" data-n="${esc(q.n)}" aria-label="${active?'取消複習註記':'加入複習註記'}">★</button><div class="qhead"><span class="num">${esc(q.n)}</span><div class="question">${esc(q.q)}</div></div><div class="subject-answer-wrap"><div class="label">答案</div><div class="answer">${esc(q.a)}</div><div class="source">出處｜${esc(q.src)}</div></div></article>`}).join('');list.querySelectorAll('.star-btn').forEach(b=>b.onclick=(e)=>{e.stopPropagation();toggleStar(Number(b.dataset.si),b.dataset.n);});
list.querySelectorAll('.subject-question-card').forEach(card=>{
const toggle=()=>{const collapsed=card.classList.toggle('collapsed-answer');card.setAttribute('aria-expanded',String(!collapsed));};
card.addEventListener('click',toggle);
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
});
}
function renderReview(){
reviewList.innerHTML=DATA.map((s,si)=>{
const qs=s.questions.filter(q=>starred.has(qkey(si,q.n)));
const cards=qs.length?qs.map(q=>`<article class="review-card review-question-card collapsed-answer" tabindex="0" role="button" aria-expanded="false"><button class="star-btn active" type="button" data-si="${si}" data-n="${esc(q.n)}" aria-label="取消複習註記">★</button><div class="review-q"><span class="review-num">${esc(q.n)}</span>${esc(q.q)}</div><div class="review-answer-wrap"><div class="label">答案</div><div class="answer">${esc(q.a)}</div></div></article>`).join(''):'<div class="review-empty">目前沒有註記題目</div>';
return `<section class="review-group collapsed"><button class="review-group-toggle" type="button" aria-expanded="false"><span>${esc(s.title)}</span><span class="review-arrow">▼</span></button><div class="review-group-body">${cards}</div></section>`;
}).join('');
reviewList.querySelectorAll('.star-btn').forEach(b=>b.onclick=(e)=>{e.stopPropagation();toggleStar(Number(b.dataset.si),b.dataset.n);});
reviewList.querySelectorAll('.review-question-card').forEach(card=>{
const toggle=()=>{const collapsed=card.classList.toggle('collapsed-answer');card.setAttribute('aria-expanded',String(!collapsed));};
card.addEventListener('click',toggle);
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
});
reviewList.querySelectorAll('.review-group-toggle').forEach(btn=>btn.onclick=()=>{
const group=btn.closest('.review-group');
const collapsed=group.classList.toggle('collapsed');
btn.setAttribute('aria-expanded',String(!collapsed));
});
}
function openReview(){home.classList.remove('active');subject.classList.remove('active');review.classList.add('active');renderReview();window.scrollTo({top:0,behavior:'instant'});history.replaceState(null,'','#review');}
search.addEventListener('input',()=>render(getFilteredQuestions()));
rangeStart.addEventListener('input',()=>{saveCurrentRange();render(getFilteredQuestions());});
rangeEnd.addEventListener('input',()=>{saveCurrentRange();render(getFilteredQuestions());});
document.getElementById('backBtn').onclick=()=>{subject.classList.remove('active');review.classList.remove('active');home.classList.add('active');history.replaceState(null,'','#');window.scrollTo({top:0,behavior:'instant'})};
document.getElementById('reviewBackBtn').onclick=()=>{review.classList.remove('active');subject.classList.remove('active');home.classList.add('active');history.replaceState(null,'','#');window.scrollTo({top:0,behavior:'instant'})};
if(location.hash==='#review')openReview();else{const m=location.hash.match(/^#s([1-4])$/);if(m)openSubject(Number(m[1])-1);}
</script>
</body></html>
